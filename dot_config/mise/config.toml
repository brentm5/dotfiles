[settings]
#legacy_version_file = true
#asdf_compat = true
trusted_config_paths = [
  '~/code',
  '~/.codex/worktree',
]
experimental = true

[tool_alias]
csvlens = 'github:ys-l/csvlens'
datadog-sbom-generator = 'github:datadog/datadog-sbom-generator'
datadog-static-analyzer = 'github:datadog/datadog-static-analyzer'
